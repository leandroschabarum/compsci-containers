name: shortener

x-podman:
  in_pod: false

x-api: &api
  image: localhost/shortener:latest
  restart: always
  mem_limit: 96m
  memswap_limit: 96m
  stop_grace_period: 3s
  volumes:
    - ./database:/data
  # O Podman do Alpine não agenda healthchecks (não há systemd).
  # Quem roda este teste é o scripts/healthwatch.sh.
  healthcheck:
    test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
    timeout: 3s
    retries: 3

services:
  api1:
    <<: *api
    build: ./api
    container_name: api1
    environment: { INSTANCE: api1, CHAOS_ENABLED: "true" }
    networks: { app: { ipv4_address: 10.90.0.11 } }

  api2:
    <<: *api
    container_name: api2
    environment: { INSTANCE: api2, CHAOS_ENABLED: "true" }
    networks: { app: { ipv4_address: 10.90.0.12 } }

  api3:
    <<: *api
    container_name: api3
    environment: { INSTANCE: api3, CHAOS_ENABLED: "true" }
    networks: { app: { ipv4_address: 10.90.0.13 } }

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    container_name: nginx
    restart: always
    mem_limit: 32m
    ports: ["8080:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/503.html:/usr/share/nginx/html/503.html:ro
    depends_on: [api1, api2, api3]
    networks: [app]

  prometheus:
    image: docker.io/prom/prometheus:v3.1.0
    container_name: prometheus
    restart: always
    mem_limit: 200m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [app]

  grafana:
    image: docker.io/grafana/grafana:11.4.0
    container_name: grafana
    restart: always
    mem_limit: 200m
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/shortener.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [app]

  podman-exporter:
    image: quay.io/navidys/prometheus-podman-exporter:v1.21.2
    container_name: podman-exporter
    restart: always
    mem_limit: 48m
    user: root
    command: ["--collector.enhance-metrics"]
    environment:
      CONTAINER_HOST: unix:///run/podman/podman.sock
    volumes:
      - /run/podman/podman.sock:/run/podman/podman.sock
    networks: [app]

  node-exporter:
    image: docker.io/prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: always
    mem_limit: 32m
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks: [app]

# IPs fixos para as réplicas: o nginx aponta para eles direto e não depende
# do DNS da rede quando um contêiner reinicia.
networks:
  app:
    ipam:
      config:
        - subnet: 10.90.0.0/24
