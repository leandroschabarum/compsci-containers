# max_fails/fail_timeout: depois de uma falha, a réplica sai do balanceamento
# por 10s (checagem passiva, a ativa só existe no nginx pago).
upstream api {
    server 10.90.0.11:8080 max_fails=1 fail_timeout=10s;
    server 10.90.0.12:8080 max_fails=1 fail_timeout=10s;
    server 10.90.0.13:8080 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;

    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    add_header X-Upstream $upstream_addr always;

    # Uma réplica travada aceita a conexão mas não responde. Com 3s de espera,
    # a requisição vai para outra réplica. POST não é repetido por padrão por
    # não ser idempotente, o que impede um /shortme?case=loop de derrubar as três.
    location / {
        proxy_pass http://api;
        proxy_read_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # Encurtar segue redirecionamentos e pode levar dezenas de segundos.
    location = /links {
        proxy_pass http://api;
        proxy_read_timeout 120s;
    }

    # "=503" troca o status da resposta: sem ele, a página sairia com o 502 original.
    error_page 502 503 504 =503 /503.html;
    location = /503.html {
        root /usr/share/nginx/html;
        internal;
    }
}
